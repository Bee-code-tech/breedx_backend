name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # The Google AI packages need Node 22 or newer
          node-version: '22'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Type-check
      - name: Type check
        run: npm run type-check

      # 5. Build
      - name: Build
        run: npm run build

      # 6. SSH into server, pull latest, rebuild, restart PM2
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd ~/breedx_backend
            # What the server looks like, so a failure below is easy to read
            echo "node $(node -v), npm $(npm -v)"
            df -h ~ | tail -1
            free -m | sed -n 2p
            git status --short | head -20
            # Match GitHub exactly, even if files were changed on the server
            # (.env, node_modules and dist aren't tracked, so they stay)
            git fetch origin main
            git reset --hard origin/main
            npm ci --no-audit --no-fund
            # Small servers can run out of memory while compiling
            NODE_OPTIONS=--max-old-space-size=1536 npm run build
            pm2 restart ecosystem.config.js --update-env || pm2 start ecosystem.config.js
            pm2 save