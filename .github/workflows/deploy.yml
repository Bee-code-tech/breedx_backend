name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Type-check
      - name: Type check
        run: npm run type-check

      # 5. Build
      - name: Build
        run: npm run build

      # 6. SSH into server, pull latest, rebuild, restart PM2
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
             echo "--- DIAGNOSTICS ---"
             whoami
             pwd
             export NVM_DIR="$HOME/.nvm"
             [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
             export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
             echo "Node path: $(which node)"
             echo "PM2 path: $(which pm2)"
             
             cd ~/lodgr_backend || (echo "FAILED: Directory not found" && exit 1)
             git pull origin main || (echo "FAILED: Git pull failed" && exit 1)
             npm install || (echo "FAILED: npm install failed" && exit 1)
             npm run build || (echo "FAILED: Build failed" && exit 1)
             pm2 restart lodgr --update-env || pm2 start ecosystem.config.js || (echo "FAILED: PM2 failed" && exit 1)
             pm2 save
